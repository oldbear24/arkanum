name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint and typecheck
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Install Playwright browser
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Smoke test
        run: npm --prefix web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=0.0.0-ci -t arkanum .

      - name: Check the reported version
        run: docker run --rm arkanum --version | grep -Fx 'arkanum version 0.0.0-ci'

      - name: Start container
        run: docker run -d --name arkanum -p 8090:8090 -v arkanum-data:/pb_data arkanum

      - name: Wait for the healthcheck
        run: |
          for attempt in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' arkanum)
            echo "$attempt: $status"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs arkanum
          exit 1

      - name: Check the API, the frontend and the system templates
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8090/api/health
          curl --fail --silent --show-error http://127.0.0.1:8090/dilna/abc | grep -q 'id="root"'
          curl --fail --silent --show-error http://127.0.0.1:8090/api/collections/templates/records | grep -q '"totalItems":5'

      - name: Create a superuser the way the README says
        run: |
          docker exec arkanum arkanum superuser upsert admin@example.com correct-horse-battery --dir=/pb_data
          curl --fail --silent --show-error -X POST http://127.0.0.1:8090/api/collections/_superusers/auth-with-password \
            -H 'Content-Type: application/json' \
            -d '{"identity":"admin@example.com","password":"correct-horse-battery"}' > /dev/null

      - name: Keep data in the volume across a restart
        run: |
          curl --fail --silent --show-error -X POST http://127.0.0.1:8090/api/collections/users/records \
            -H 'Content-Type: application/json' \
            -d '{"handle":"ci_uzivatel","email":"ci@example.com","password":"correct-horse-battery","passwordConfirm":"correct-horse-battery"}' > /dev/null
          docker restart arkanum
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/api/collections/users/records | grep -q '"handle":"ci_uzivatel"'; then exit 0; fi
            sleep 2
          done
          docker logs arkanum
          exit 1

      # The steps below follow docs/docker-compose.md, with an image built from this commit.
      - name: Start with Compose
        run: |
          docker rm -f arkanum
          docker volume rm arkanum-data
          docker tag arkanum ghcr.io/oldbear24/arkanum:ci
          cp .env.example .env
          sed -i 's/^ARKANUM_VERSION=.*/ARKANUM_VERSION=ci/' .env
          sed -i "s/^PB_ENCRYPTION_KEY=.*/PB_ENCRYPTION_KEY=$(openssl rand -hex 16)/" .env
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8090/api/health
          ARKANUM_PORT=127.0.0.1:8090 docker compose config | grep -q 'host_ip: 127.0.0.1'

      - name: Create a superuser and seed demo data with Compose
        run: |
          docker compose exec -T arkanum arkanum superuser upsert admin@example.com correct-horse-battery --dir=/pb_data
          docker compose exec -T arkanum arkanum seed --dir=/pb_data | grep 'generated password'
          curl --fail --silent --show-error http://127.0.0.1:8090/api/collections/users/records | grep -q '"handle":"noctua"'

      - name: Back up and restore with Compose
        run: |
          docker compose stop
          docker run --rm -v arkanum-data:/data -v "$PWD":/backup alpine tar czf /backup/arkanum-zaloha.tar.gz -C /data .
          docker compose start
          docker compose down -v
          docker compose create
          docker compose stop
          docker run --rm -v arkanum-data:/data -v "$PWD":/backup alpine sh -c "rm -rf /data/* && tar xzf /backup/arkanum-zaloha.tar.gz -C /data"
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8090/api/collections/users/records | grep -q '"handle":"noctua"'
          curl --fail --silent --show-error -X POST http://127.0.0.1:8090/api/collections/_superusers/auth-with-password \
            -H 'Content-Type: application/json' \
            -d '{"identity":"admin@example.com","password":"correct-horse-battery"}' > /dev/null

      - name: Show what Compose saw on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
