<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Arkánum – dílna na telefonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aboreto&amp;family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Grenze+Gotisch:wght@500;600&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0f0d1e}
a{color:#e6c37a}a:hover{color:#f6dfa8}
:focus-visible{outline:2px solid #e6c37a;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: #0f0d1e; background-image: radial-gradient(circle at 18% 22%, rgba(239,230,208,0.45) 0, rgba(239,230,208,0.45) 1px, rgba(239,230,208,0) 1.6px), radial-gradient(circle at 63% 71%, rgba(214,176,103,0.4) 0, rgba(214,176,103,0.4) 1px, rgba(214,176,103,0) 1.6px); background-size: 170px 150px, 230px 210px; color: #efe6d0; font-family: 'Jost', system-ui, sans-serif;">

<header style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px;">
<a href="Main.dc.html" aria-label="Zpět do galerie" style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: 22px; color: #efe6d0; display: inline-flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5L8 12L15 19"></path></svg></a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 17px; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #a6e3c2;"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #7fd3a6;"></span>Uloženo</span>
</div>
<button type="button" style="flex: 0 0 auto; height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #d6b067; color: #1b1405; font-family: 'Jost', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;">Publikovat</button>
</header>

<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 6px 0 14px;">
<div style="width: {{c.cardW}};">
<dc-import name="Karta" variant="{{c.variant}}" art="{{c.art}}" frame="{{c.frame}}" palette="{{c.palette}}" element="{{c.element}}" foil="{{c.foil}}" foil-i="{{c.foilI}}" edge="{{c.edge}}" thick="{{c.thick}}" font="{{c.font}}" card-title="{{c.title}}" numeral="{{c.numeral}}" subtitle="{{c.subtitle}}" hp="{{c.hp}}" s1="{{c.s1}}" s2="{{c.s2}}" flip="{{c.flip}}" spin="{{c.spin}}" interactive="drag" pad="{{ 0 }}" hint-size="100%,309px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<div style="display: flex; gap: 2px; padding: 3px; border-radius: 26px; background: #17142c; border: 1px solid #2e2950;">
<button type="button" onClick="{{h.front}}" aria-pressed="{{c.frontPressed}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.frontBg}}; color: {{c.frontFg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer;">Přední strana</button>
<button type="button" onClick="{{h.back}}" aria-pressed="{{c.backPressed}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.backBg}}; color: {{c.backFg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer;">Rub</button>
</div>
<button type="button" onClick="{{h.spin}}" aria-pressed="{{c.spinPressed}}" aria-label="Otáčet kartou" style="width: 50px; height: 50px; border-radius: 25px; border: 1px solid {{c.spinBd}}; background: #17142c; color: #efe6d0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12A8 8 0 1 1 17.7 6.3M20 4V8H16"></path></svg></button>
</div>
</div>

<section aria-label="Nastavení karty" style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #16132b; border-top: 1px solid #2b2650; border-radius: 22px 22px 0 0;">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3a3468; margin: 8px 0 2px;"></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 8px; border-bottom: 1px solid #2b2650;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 58px; border: 0; border-bottom: 2px solid {{t.bd}}; background: transparent; color: {{t.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12px; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg><span>{{t.label}}</span></button>
</sc-for>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 18px;">

<sc-if value="{{c.tabMaterial}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Fólie</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{foils}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12px; cursor: pointer;"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9px; border: 1px solid #4a4380; background: {{o.sw}};"></span><span>{{o.label}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: baseline; justify-content: space-between;"><label for="m-intenzita" style="font-size: 14px; color: #c4bbd6;">Intenzita fólie</label><span style="font-size: 13px; color: #a49cbd;">{{c.foilI}} %</span></div>
<input id="m-intenzita" type="range" min="0" max="100" step="1" value="{{c.foilI}}" onChange="{{h.foilI}}" style="width: 100%; height: 36px; accent-color: #d6b067;">
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Ořízka</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{edges}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12px; cursor: pointer;"><span aria-hidden="true" style="width: 10px; height: 30px; border-radius: 3px; border: 1px solid #4a4380; background: {{o.sw}};"></span><span>{{o.label}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: baseline; justify-content: space-between;"><label for="m-tloustka" style="font-size: 14px; color: #c4bbd6;">Tloušťka karty</label><span style="font-size: 13px; color: #a49cbd;">{{c.thickMm}}</span></div>
<input id="m-tloustka" type="range" min="1" max="8" step="0.5" value="{{c.thick}}" onChange="{{h.thick}}" style="width: 100%; height: 36px; accent-color: #d6b067;">
</div>
</sc-if>

<sc-if value="{{c.tabVzhled}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Šablona</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{variants}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 44px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer;">{{o.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{c.isTarot}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Ilustrace</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{arts}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 14px; text-align: left; cursor: pointer;"><span style="min-width: 36px; font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 12px; color: #d6b067;">{{o.num}}</span>{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{c.isTarotLike}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Rám</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{frames}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12px; cursor: pointer;"><svg width="20" height="30" viewBox="20 56 260 378" aria-hidden="true"><path d="{{o.win}}" fill="none" stroke="#d6b067" stroke-width="16" stroke-linejoin="round"></path></svg><span>{{o.label}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Paleta</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{palettes}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 12px; cursor: pointer;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; border: 1px solid #4a4380; background: {{o.base}}; display: inline-flex; align-items: center; justify-content: center;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{o.gold}};"></span></span><span>{{o.label}}</span></button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{c.isBestie}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Element</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{elements}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer;"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: {{o.color}};"></span>{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
</sc-if>

<sc-if value="{{c.tabText}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="m-nazev" style="font-size: 14px; color: #c4bbd6;">Název karty</label>
<input id="m-nazev" type="text" value="{{c.title}}" onChange="{{h.title}}" maxlength="28" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #3a3468; background: #100e20; color: #efe6d0; font-family: 'Jost', sans-serif; font-size: 16px;">
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #a49cbd;">Písmo nadpisu</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{fonts}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 58px; padding: 8px 12px; border-radius: 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; text-align: left; cursor: pointer;"><span style="font-family: {{o.ff}}; font-weight: {{o.fw}}; font-size: 18px; line-height: 1.2; color: #efe6d0;">Arkána</span><span style="font-family: 'Jost', sans-serif; font-size: 12px; color: #a49cbd;">{{o.label}}</span></button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{c.tabData}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{c.isTarotLike}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="m-vyznam" style="font-size: 14px; color: #c4bbd6;">{{c.meaningLabel}}</label>
<textarea id="m-vyznam" value="{{c.upright}}" onChange="{{h.upright}}" rows="5" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #3a3468; background: #100e20; color: #efe6d0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; line-height: 1.35; resize: vertical;"></textarea>
</div>
</sc-if>
<sc-if value="{{c.isTcg}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{steppers}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span style="font-size: 15px; color: #c4bbd6;">{{s.label}}</span>
<div style="display: flex; align-items: center; border: 1px solid #2e2950; border-radius: 12px; background: #100e20;">
<button type="button" onClick="{{s.dec}}" aria-label="{{s.decLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #efe6d0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12H18"></path></svg></button>
<span style="min-width: 44px; text-align: center; font-family: 'Cinzel', Georgia, serif; font-weight: 600; font-size: 16px;">{{s.value}}</span>
<button type="button" onClick="{{s.inc}}" aria-label="{{s.incLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #efe6d0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12H18M12 6V18"></path></svg></button>
</div>
</div>
</sc-for>
</div>
</sc-if>
</sc-if>

</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = Object.assign({}, this.state, {
      variant: 'tarot', art: 'hvezda', frame: 'secese', palette: 'pulnoc', element: 'mlha',
      foil: 'duha', foilI: 75, edge: 'zlata', thick: 4, font: 'cinzel',
      title: 'Hvězda', numeral: 'XVII', subtitle: '', hp: 70, s1: 4, s2: 6,
      upright: 'Naděje, inspirace a klid po bouři. Víra, že se věci obracejí k lepšímu.',
      flip: false, spin: false, tab: 'material'
    });
  }

  renderVals() {
    const st = this.state;
    const sel = (on) => ({ bg: on ? '#2a2552' : '#1b1833', bd: on ? '#d6b067' : '#2e2950', fg: on ? '#efe6d0' : '#c4bbd6', pressed: on ? 'true' : 'false' });
    const isTcg = st.variant === 'bestie' || st.variant === 'hrdina';
    const ARTS = { hvezda: ['Hvězda', 'XVII'], mesic: ['Měsíc', 'XVIII'], slunce: ['Slunce', 'XIX'], mag: ['Mág', 'I'] };
    const VDEF = {
      tarot: { title: ARTS[st.art][0], numeral: ARTS[st.art][1], subtitle: '', palette: 'pulnoc', frame: 'secese', edge: 'zlata' },
      orakulum: { title: 'Trpělivost', subtitle: 'Co má vyrůst, nespěchá.', palette: 'pergamen', frame: 'minimal', edge: 'bila', upright: 'Nespěchej. To, co právě sázíš, potřebuje čas a klid.' },
      bestie: { title: 'Bludička', subtitle: '', edge: 'cerna', hp: 70, s1: 3, s2: 2 },
      hrdina: { title: 'Strážkyně brány', subtitle: 'Brána se otevře jen tomu, kdo zná heslo.', edge: 'cerna', s1: 4, s2: 6 }
    };
    const TABS = [
      ['vzhled', 'Vzhled', 'M12 3A9 9 0 1 0 12 21C13.4 21 14 20.2 14 19.3C14 18.1 13 17.6 13 16.6C13 15.6 13.8 15 14.8 15H17A4 4 0 0 0 21 11C21 6.6 17 3 12 3ZM7.5 11.5A1 1 0 1 0 7.5 11.6M10 7.5A1 1 0 1 0 10 7.6M15 7.5A1 1 0 1 0 15 7.6'],
      ['material', 'Materiál', 'M12 3L13.6 9.4L20 11L13.6 12.6L12 19L10.4 12.6L4 11L10.4 9.4Z'],
      ['text', 'Text', 'M5 6H19M12 6V19M9 19H15'],
      ['data', { tarot: 'Význam', orakulum: 'Výklad', bestie: 'Hra', hrdina: 'Hra' }[st.variant], 'M4 5H10C11.1 5 12 5.9 12 7V19C12 18.2 11.3 17.5 10.5 17.5H4ZM20 5H14C12.9 5 12 5.9 12 7V19C12 18.2 12.7 17.5 13.5 17.5H20Z']
    ];
    const tabs = TABS.map((t) => {
      const on = st.tab === t[0];
      return { label: t[1], icon: t[2], pick: () => this.setState({ tab: t[0] }), pressed: on ? 'true' : 'false', fg: on ? '#efe6d0' : '#a49cbd', bd: on ? '#d6b067' : 'transparent' };
    });
    const variants = [['tarot', 'Tarot'], ['bestie', 'Bestie'], ['hrdina', 'Hrdina'], ['orakulum', 'Orákulum']].map((o) => Object.assign({ label: o[1], pick: () => this.setState(Object.assign({ variant: o[0], flip: false }, VDEF[o[0]])) }, sel(st.variant === o[0])));
    const arts = [['hvezda', 'Hvězda', 'XVII'], ['mesic', 'Měsíc', 'XVIII'], ['slunce', 'Slunce', 'XIX'], ['mag', 'Mág', 'I']].map((o) => Object.assign({ label: o[1], num: o[2], pick: () => this.setState({ art: o[0], title: o[1], numeral: o[2] }) }, sel(st.art === o[0])));
    const WIN = {
      secese: 'M34 420L34 190A116 116 0 0 1 266 190L266 420Z',
      deco: 'M34 420L34 96L46 96L46 84L58 84L58 72L242 72L242 84L254 84L254 96L266 96L266 420Z',
      gotika: 'M34 420L34 232A170 170 0 0 1 150 70.8A170 170 0 0 1 266 232L266 420Z',
      minimal: 'M34 420L34 72L266 72L266 420Z'
    };
    const frames = [['secese', 'Secese'], ['deco', 'Deco'], ['gotika', 'Gotika'], ['minimal', 'Minimal']].map((o) => Object.assign({ label: o[1], win: WIN[o[0]], pick: () => this.setState({ frame: o[0] }) }, sel(st.frame === o[0])));
    const palettes = [['pulnoc', 'Půlnoc', '#14112a', '#d6b067'], ['krev', 'Krev', '#230a11', '#dca55a'], ['smaragd', 'Smaragd', '#0b1f1b', '#d3b56f'], ['pergamen', 'Pergamen', '#ece1c8', '#4b3520']].map((o) => Object.assign({ label: o[1], base: o[2], gold: o[3], pick: () => this.setState({ palette: o[0] }) }, sel(st.palette === o[0])));
    const elements = [['mlha', 'Mlha', '#5fc4b8'], ['ohen', 'Oheň', '#ee7a45'], ['les', 'Les', '#7cbf5a'], ['blesk', 'Blesk', '#e6c548'], ['stin', 'Stín', '#a58be6']].map((o) => Object.assign({ label: o[1], color: o[2], pick: () => this.setState({ element: o[0] }) }, sel(st.element === o[0])));
    const foils = [
      ['zadna', 'Žádná', 'linear-gradient(135deg, #2b2650, #2b2650)'],
      ['zlata', 'Zlatá', 'linear-gradient(135deg, #7d5f28 0%, #f3dca0 48%, #8f6c2f 100%)'],
      ['duha', 'Duhová', 'linear-gradient(135deg, #ff7ab6 0%, #ffd36b 30%, #6bffc8 55%, #6bb6ff 78%, #c08bff 100%)'],
      ['kosmos', 'Kosmos', 'radial-gradient(circle at 30% 35%, #ffffff 0, #ffffff 1px, rgba(255,255,255,0) 2px), radial-gradient(circle at 70% 60%, #ffe2aa 0, #ffe2aa 1px, rgba(255,255,255,0) 2px), linear-gradient(135deg, #1b1740, #3a2a6a)']
    ].map((o) => Object.assign({ label: o[1], sw: o[2], pick: () => this.setState({ foil: o[0] }) }, sel(st.foil === o[0])));
    const BASES = { pulnoc: '#14112a', krev: '#230a11', smaragd: '#0b1f1b', pergamen: '#ece1c8' };
    const cardBase = st.variant === 'bestie' ? '#15171c' : st.variant === 'hrdina' ? '#1a1512' : BASES[st.palette];
    const edges = [['zlata', 'Zlatá', 'linear-gradient(90deg, #8a6a2f, #f0d796, #8a6a2f)'], ['cerna', 'Černá', '#141416'], ['bila', 'Bílá', '#ece6d8'], ['ram', 'Karta', cardBase]].map((o) => Object.assign({ label: o[1], sw: o[2], pick: () => this.setState({ edge: o[0] }) }, sel(st.edge === o[0])));
    const fonts = [['cinzel', 'Cinzel', "'Cinzel', Georgia, serif", 600], ['cormorant', 'Cormorant', "'Cormorant Garamond', Georgia, serif", 700], ['aboreto', 'Aboreto', "'Aboreto', Georgia, serif", 400], ['gotika', 'Grenze Gotisch', "'Grenze Gotisch', Georgia, serif", 600]].map((o) => Object.assign({ label: o[1], ff: o[2], fw: o[3], pick: () => this.setState({ font: o[0] }) }, sel(st.font === o[0])));
    const step = (key, label, min, max, d) => ({
      label: label,
      value: st[key],
      dec: () => this.setState((s) => ({ [key]: Math.max(min, s[key] - d) })),
      inc: () => this.setState((s) => ({ [key]: Math.min(max, s[key] + d) })),
      decLabel: 'Snížit: ' + label,
      incLabel: 'Zvýšit: ' + label
    });
    const steppers = st.variant === 'hrdina'
      ? [step('s1', 'Síla', 0, 12, 1), step('s2', 'Obrana', 0, 12, 1)]
      : [step('hp', 'Životy', 10, 200, 10), step('s1', 'Útok', 0, 12, 1), step('s2', 'Obrana', 0, 12, 1)];
    const h = {
      title: (e) => this.setState({ title: e.target.value }),
      upright: (e) => this.setState({ upright: e.target.value }),
      foilI: (e) => this.setState({ foilI: Number(e.target.value) }),
      thick: (e) => this.setState({ thick: Number(e.target.value) }),
      front: () => this.setState({ flip: false }),
      back: () => this.setState({ flip: true }),
      spin: () => this.setState((s) => ({ spin: !s.spin }))
    };
    const c = Object.assign({}, st, {
      cardW: isTcg ? '214px' : '180px',
      thickMm: (st.thick * 0.15).toFixed(2).replace('.', ',') + ' mm',
      meaningLabel: st.variant === 'orakulum' ? 'Výklad karty' : 'Význam ve vzpřímené poloze',
      isTarot: st.variant === 'tarot',
      isTarotLike: !isTcg,
      isBestie: st.variant === 'bestie',
      isTcg: isTcg,
      tabVzhled: st.tab === 'vzhled',
      tabMaterial: st.tab === 'material',
      tabText: st.tab === 'text',
      tabData: st.tab === 'data',
      frontPressed: st.flip ? 'false' : 'true',
      backPressed: st.flip ? 'true' : 'false',
      frontBg: st.flip ? 'transparent' : '#2a2552',
      frontFg: st.flip ? '#a49cbd' : '#efe6d0',
      backBg: st.flip ? '#2a2552' : 'transparent',
      backFg: st.flip ? '#efe6d0' : '#a49cbd',
      spinPressed: st.spin ? 'true' : 'false',
      spinBd: st.spin ? '#d6b067' : '#2e2950'
    });
    return { c: c, h: h, tabs: tabs, variants: variants, arts: arts, frames: frames, palettes: palettes, elements: elements, foils: foils, edges: edges, fonts: fonts, steppers: steppers };
  }
}
</script>
